[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "cspaps"
version = "0.8.0"
description = "Heliostat field layout and aim-point strategy (APS) optimization for solar towers with a cylindrical receiver"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24",
    "pandas>=2.0",
    "pvlib>=0.10",
    "pyyaml>=6.0",
    "matplotlib>=3.7",
    "scipy>=1.10",
]

[project.optional-dependencies]
gui = ["streamlit>=1.35", "plotly>=5.18"]
exact = ["pyscipopt>=5"]
dev = ["pytest>=7", "streamlit>=1.35", "plotly>=5.18", "pyscipopt>=5"]

[project.scripts]
cspaps = "cspaps.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
cspaps = ["data/*.yaml", "data/*.csv", "data/wrong_site/*.yaml", "data/wrong_site/*.csv"]

[tool.pytest.ini_options]
testpaths = ["tests"]
