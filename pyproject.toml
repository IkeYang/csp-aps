[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "cspaps"
version = "0.9.0"
description = "Heliostat field layout and aim-point strategy (APS) optimization for solar towers with a cylindrical receiver"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24",
    "pandas>=2.0",
    "pvlib>=0.10",
    "pyyaml>=6.0",
    "matplotlib>=3.7",
    "scipy>=1.10",
    # compiled solver loops (bit-identical to the numpy code; without it the numpy path runs)
    "numba>=0.59",
]

[project.optional-dependencies]
gui = ["streamlit>=1.35", "plotly>=5.18"]
exact = ["pyscipopt>=5"]
# GPU backend for the spot / flux kernels (CSPAPS_GPU=1); pick the CuPy wheel of your CUDA driver (12.x here;
# CUDA 11 drivers: pip install cupy-cuda11x). RTX 2080 Ti (sm_75) and RTX 3080 (sm_86) are both supported.
gpu = ["cupy-cuda12x>=13"]
dev = ["pytest>=7", "streamlit>=1.35", "plotly>=5.18", "pyscipopt>=5"]

[project.scripts]
cspaps = "cspaps.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
cspaps = ["data/*.yaml", "data/*.csv", "data/wrong_site/*.yaml", "data/wrong_site/*.csv"]

[tool.pytest.ini_options]
testpaths = ["tests"]
