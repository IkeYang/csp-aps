# Synthetic design-study case for the Aksai region.
# Weather is NASA POWER 2024 point DNI. Field and receiver dimensions are simulation inputs, not plant records.
# Coordinates use x=east, y=north, z=up in metres with the tower base at the origin.
name: aksai_demo

site:
  latitude: 39.6317829
  longitude: 94.3388628
  elevation_m: 1680
  timezone: Asia/Shanghai

receiver:
  center: [0, 0, 100]
  diameter: 7.0
  height: 8.0
  max_flux_kw_m2: 1000
  n_azimuth: 48
  n_height: 24
  tower_diameter: 8.0
  absorptivity: 0.95
  n_panels: 12
  panel_start_azimuth_deg: -15

heliostat:
  width: 8.0
  height: 8.0
  pivot_height: 5.0
  reflectivity: 0.94
  cleanliness: 0.97
  slope_error_mrad: 1.5
  tracking_error_mrad: 1.0
  focusing: slant_range

sun:
  shape: gaussian
  sigma_mrad: 2.51
  dni_model: meinel

atmosphere:
  model: vittitoe_biggs_clear

weather:
  source: file
  file: aksai_2024_dni.csv

shading:
  enabled: true
  n_points: 5
  tower_shadow: true

field:
  generator:
    type: radial_staggered
    r_min: 50
    r_max: 220
    spacing_factor: 1.1
    radial_spacing: 0.866
    radial_growth: 0.3
    azimuthal_spacing: 1.2
  boundary:
    - [-420, -300]
    - [420, -300]
    - [420, 480]
    - [-420, 480]
  exclusion_radius: 50

aps:
  method: greedy
  safety_margin: 0.05
  n_height_levels: 7
  height_span: 0.9
  azimuth_offsets_deg: [-6, 0, 6]
  passes: 2
  tie_tolerance: 0.005
  allow_defocus: true
  verify: true
  auto_grid: true
  verify_max_rounds: 3

uniformity:
  enabled: true
  mode: weighted
  max_cv: 0.55
  weight: 0.3
  panels: null
  z_range: null
  min_load_mw: 0.0
  mu_iters: 8
  passes: 2

engine:
  period_s: 60
  command_latency_s: 5
  max_dni_age_s: 90
  forecast_margin: 0.05
  no_forecast_policy: clear_sky
  stale_policy: clear_sky
  response_refresh_deg: 0.3
  timeout_s: 20
  fallback: hold_or_defocus

realtime:
  start: "2024-03-19 15:00"
  duration_min: 8
  step_s: 60
  forecast_horizon_s: 120
  forecast_step_s: 15
  scenario: clouds
  strategies: [center, aps_reactive, aps_predictive]
  random_clouds:
    n: 2
    seed: 17
    radius_m: [70, 130]
    transmittance: [0.1, 0.35]
    speed_m_s: 8
    direction_deg: 110
    edge_m: 30

annual:
  method: sun_bins
  n_sun_bins: 4
  dni_bands: 2
  workers: 1
  year: 2024
  day_of_month: 15
  time_step_min: 60
  min_sun_elevation_deg: 5
  aiming: greedy

layout_opt:
  generator: radial_staggered
  n_heliostats: 40
  bounds:
    radial_spacing: [0.866, 1.25]
    radial_growth: [0.0, 0.6]
    azimuthal_spacing: [1.0, 1.5]
  fixed:
    spacing_factor: 1.1
  search_sampling: sun_bins
  search_aiming: auto
  n_sun_bins: 4
  review_sampling: sun_bins
  review_n_sun_bins: 3
  review_dni_bands: 2
  review_check_hourly: false
  maxiter: 1
  popsize: 2
  seed: 7
  workers: 1
  polish_rounds: 1
  refine_top: 2
  swap_rounds: 1
  swap_fraction: 0.02
  shading_points: 4

mcrt:
  rays_per_heliostat: 300
  seed: 7
  n_seeds: 2
  tracking_mode: per_ray
